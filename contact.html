<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Green Neon Contact Form</title>
    <!-- সাধারণ এবং সুন্দর ফন্ট (Inter) যুক্ত করা হলো -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            /* হালকা গ্রিন ব্যাকগ্রাউন্ড রেডিয়াল গ্র্যাডিয়েন্ট */
            background-image:
                radial-gradient(at 50% 0%, rgba(20, 83, 45, 0.15) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(34, 197, 94, 0.1) 0, transparent 50%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* গ্লোয়িং ফর্ম কন্টেইনার */
        .neon-container {
            width: 100%;
            max-width: 32rem;
            padding: 2rem;
            border-radius: 1rem;
            position: relative;
            z-index: 10;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(74, 222, 128, 0.15);
            box-shadow:
                0 0 15px rgba(74, 222, 128, 0.1),
                inset 0 0 20px rgba(74, 222, 128, 0.05);
        }

        @media (min-width: 640px) {
            .neon-container { padding: 2.5rem; }
        }

        /* কন্টেইনারের চারপাশে এনিমেটেড লাইট গ্রিন বর্ডার ইফেক্ট */
        .neon-container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #22c55e, #86efac, #15803d, #4ade80);
            z-index: -1;
            filter: blur(12px);
            opacity: 0.35;
            border-radius: inherit;
            animation: glowing 15s linear infinite;
        }

        @keyframes glowing {
            0% { background-position: 0 0; }
            50% { background-position: 400% 0; }
            100% { background-position: 0 0; }
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-header h2 {
            font-size: 1.875rem;
            font-weight: 700;
            background: linear-gradient(to right, #4ade80, #a7f3d0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 8px rgba(74, 222, 128, 0.4));
        }

        .form-header p {
            color: rgba(74, 222, 128, 0.6);
            margin-top: 0.5rem;
            font-size: 0.875rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .field-group { width: 100%; }

        /* লেবেল স্টাইল */
        .neon-label {
            color: #cbd5e1;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            display: block;
            transition: color 0.3s ease;
        }

        .field-group:focus-within .neon-label {
            color: #4ade80;
        }

        /* কাস্টম ইনপুট স্টাইল (লাইট গ্রিন ফোকাস) */
        .neon-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 0.5rem;
            padding: 0.875rem 1rem;
            color: #86efac;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        textarea.neon-input {
            resize: none;
        }

        .neon-input::placeholder {
            color: rgba(134, 239, 172, 0.3);
        }

        .neon-input:focus {
            outline: none;
            border-color: #4ade80;
            box-shadow:
                0 0 12px rgba(74, 222, 128, 0.4),
                inset 0 0 6px rgba(74, 222, 128, 0.2);
            background: rgba(6, 78, 59, 0.2);
        }

        /* নিয়ন সাবমিট বাটন */
        .btn-wrap { padding-top: 0.75rem; }

        .neon-btn {
            width: 100%;
            padding: 0.875rem 1rem;
            border-radius: 0.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            background: rgba(21, 128, 61, 0.1);
            border: 1px solid #4ade80;
            color: #4ade80;
            font-weight: 600;
            font-size: 1rem;
            font-family: inherit;
            letter-spacing: 1px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            text-shadow: 0 0 4px rgba(74, 222, 128, 0.5);
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.2), inset 0 0 8px rgba(74, 222, 128, 0.1);
        }

        .neon-btn svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        .neon-btn:hover {
            background: #4ade80;
            color: #022c22;
            box-shadow:
                0 0 20px rgba(74, 222, 128, 0.6),
                0 0 35px rgba(74, 222, 128, 0.4),
                inset 0 0 10px rgba(255, 255, 255, 0.4);
            text-shadow: none;
        }

        .neon-btn:active {
            transform: scale(0.98);
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* সাকসেস মেসেজ */
        .success-state {
            display: none;
            text-align: center;
            padding: 2rem 0;
        }

        .success-state.show {
            display: block;
        }

        .success-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 4rem;
            height: 4rem;
            border-radius: 9999px;
            border: 2px solid #4ade80;
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.3);
            margin-bottom: 1rem;
            background: rgba(74, 222, 128, 0.1);
        }

        .success-icon svg {
            width: 2rem;
            height: 2rem;
            color: #4ade80;
            filter: drop-shadow(0 0 5px rgba(74, 222, 128, 0.5));
        }

        .success-state h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #6ee7b7;
            filter: drop-shadow(0 0 8px rgba(74, 222, 128, 0.3));
            margin-bottom: 0.5rem;
        }

        .success-state p {
            color: rgba(74, 222, 128, 0.7);
            font-size: 0.875rem;
        }

        .reset-btn {
            margin-top: 1.5rem;
            background: none;
            border: none;
            color: #22c55e;
            font-size: 0.875rem;
            text-decoration: underline;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .reset-btn:hover {
            color: #86efac;
            filter: drop-shadow(0 0 5px rgba(74, 222, 128, 0.5));
        }
    </style>
</head>
<body>

    <!-- গ্লোয়িং ফর্ম কন্টেইনার -->
    <div class="neon-container">

        <a href="index.html" style="position:absolute; top:1.25rem; left:1.25rem; color:#4ade80; text-decoration:none; font-size:0.85rem; display:flex; align-items:center; gap:6px; opacity:0.8; transition:opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.8">&#8592; Home</a>
        <div class="form-header">
            <h2>Contact Us</h2>
            <p>We would love to hear from you!</p>
        </div>

        <form action="https://api.web3forms.com/submit" method="post" id="glowForm">
            <input type="hidden" name="access_key" value="3f1cc6be-ed95-4831-b984-0b19db2647e6">

            <!-- নাম (Name) -->
            <div class="field-group">
                <label for="fullName" class="neon-label">Your Name</label>
                <input type="text" id="fullName" name="from_name" class="neon-input" placeholder="e.g. John Doe" required>
            </div>

            <!-- ইমেইল (Email) -->
            <div class="field-group">
                <label for="email" class="neon-label">Email Address</label>
                <input type="email" id="email" name="email" class="neon-input" placeholder="e.g. john@example.com" required>
            </div>

            <!-- বিষয় (Subject) -->
            <div class="field-group">
                <label for="subject" class="neon-label">Subject</label>
                <input type="text" id="subject" name="subject" class="neon-input" placeholder="How can I help?" required>
            </div>

            <!-- মেসেজ (Message) -->
            <div class="field-group">
                <label for="message" class="neon-label">Message</label>
                <textarea id="message" name="message" rows="4" class="neon-input" placeholder="Write your message here..." required></textarea>
            </div>

            <!-- সাবমিট বাটন -->
            <div class="btn-wrap">
                <button type="submit" class="neon-btn">
                    <span>Send Message</span>
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </button>
            </div>
        </form>

        <!-- সাকসেস মেসেজ -->
        <div id="successState" class="success-state">
            <div class="success-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h3>Message Sent!</h3>
            <p>Thank you for contacting us. We will get back to you soon.</p>

            <button onclick="resetForm()" class="reset-btn">
                Send another message
            </button>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.getElementById('glowForm');

            if (form) {
                // এই অংশটি নিজে থেকেই ফর্মের সাবমিট বাটনকে চিনে নেবে
                form.addEventListener('submit', function(event) {
                    event.preventDefault(); // পেজ রিলোড বন্ধ করা

                    const successState = document.getElementById('successState');
                    const submitBtn = form.querySelector('button[type="submit"]');
                    const originalBtnContent = submitBtn.innerHTML;

                    // লোডিং স্পিনার অ্যানিমেশন চালু করা
                    submitBtn.innerHTML = `
                        <svg class="spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" style="width:1.25rem;height:1.25rem;">
                            <circle style="opacity:0.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path style="opacity:0.75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Sending...
                    `;
                    submitBtn.style.pointerEvents = 'none';
                    submitBtn.style.opacity = '0.8';

                    // Web3Forms-এ ডাটা পাঠানো
                    fetch(form.action, {
                        method: form.method,
                        body: new FormData(form),
                        headers: { 'Accept': 'application/json' }
                    }).then(response => {
                        if (response.ok) {
                            form.style.display = 'none';
                            successState.classList.add('show');
                            form.reset();
                        } else {
                            alert("Oops! Something went wrong.");
                        }
                    }).catch(error => {
                        alert("Network error! Please check your connection.");
                    }).finally(() => {
                        // বাটনকে আগের ডিজাইনে ফিরিয়ে আনা
                        submitBtn.innerHTML = originalBtnContent;
                        submitBtn.style.pointerEvents = 'auto';
                        submitBtn.style.opacity = '1';
                    });
                });
            }
        });

        // ফর্ম পুনরায় দেখানোর ফাংশন
        function resetForm() {
            document.getElementById('successState').classList.remove('show');
            document.getElementById('glowForm').style.display = 'flex';
        }
    </script>

</body>
</html>
