<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | My Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --c-green: #00ff88;
            --c-cyan: #00e6ff;
            --c-pink: #ff2b6e;
            --c-purple: #7c4dff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            /* মাল্টি-কালার রেডিয়াল গ্রেডিয়েন্ট ব্যাকগ্রাউন্ড */
            background-image:
                radial-gradient(circle at 15% 50%, rgba(255, 43, 110, 0.15), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(0, 230, 255, 0.15), transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(0, 255, 136, 0.15), transparent 50%);
            color: #fff; min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
            padding: 2rem 1rem; position: relative; overflow-x: hidden;
        }

        /* ভাসমান গ্র্যাডিয়েন্ট ব্লব — index.html এর সাথে ভিজ্যুয়াল consistency রাখার জন্য */
        .blob { position: fixed; border-radius: 50%; filter: blur(70px); opacity: 0.12; pointer-events: none; z-index: 0; }
        .blob-a { width: 300px; height: 300px; background: var(--c-green); top: -60px; left: -60px; animation: blobFloat 14s ease-in-out infinite; }
        .blob-b { width: 260px; height: 260px; background: var(--c-cyan); bottom: -60px; right: -40px; animation: blobFloat 18s ease-in-out infinite reverse; }
        @keyframes blobFloat { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(30px, -30px) scale(1.15); } 66% { transform: translate(-20px, 20px) scale(0.9); } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
        }

        /* অ্যানিমেটেড গ্রেডিয়েন্ট টেক্সট */
        .gradient-text {
            background: linear-gradient(90deg, var(--c-green), var(--c-cyan), var(--c-pink), var(--c-green));
            background-size: 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientMove 5s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* মূল ফর্ম কন্টেইনার */
        .neon-container {
            width: 100%; max-width: 32rem; margin: auto; padding: 2.5rem 2rem;
            border-radius: 1rem; position: relative; z-index: 10;
            background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* কন্টেইনারের চারপাশে অ্যানিমেটেড গ্রেডিয়েন্ট বর্ডার গ্লো */
        .neon-container::before {
            content: ''; position: absolute; inset: -3px;
            background: linear-gradient(45deg, var(--c-pink), var(--c-cyan), var(--c-green), var(--c-purple), var(--c-pink));
            background-size: 400%; z-index: -1; filter: blur(15px); opacity: 0.7;
            border-radius: inherit; animation: glowing 8s linear infinite;
        }
        @keyframes glowing {
            0% { background-position: 0 0; }
            50% { background-position: 400% 0; }
            100% { background-position: 0 0; }
        }

        .back-home {
            position: absolute; top: 1.25rem; left: 1.25rem; text-decoration: none; font-size: 0.85rem;
            display: inline-flex; align-items: center; gap: 6px; transition: all 0.3s ease;
        }
        .back-home .arrow { display: inline-block; transition: transform 0.3s ease; }
        .back-home:hover .arrow { transform: translateX(-4px); }

        .form-header { text-align: center; margin-bottom: 2rem; }
        .form-header h2 { font-size: 2.2rem; font-weight: 800; filter: drop-shadow(0 0 8px rgba(0, 230, 255, 0.3)); }
        .form-header p { color: #a0a0a0; margin-top: 0.5rem; font-size: 0.95rem; }

        form { display: flex; flex-direction: column; gap: 1.25rem; }
        .field-group { width: 100%; position: relative; }

        .neon-label { color: #cbd5e1; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem; display: block; transition: all 0.3s ease; }

        /* ইনপুট ফিল্ডে ফোকাস করলে লেবেল গ্রেডিয়েন্ট হবে */
        .field-group:focus-within .neon-label {
            background: linear-gradient(90deg, var(--c-cyan), var(--c-green));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }

        .neon-input {
            width: 100%; background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 0.5rem;
            padding: 0.875rem 1rem; color: #fff; font-size: 1rem; font-family: inherit; transition: all 0.3s ease;
        }
        textarea.neon-input { resize: none; }
        .neon-input::placeholder { color: rgba(255, 255, 255, 0.3); }

        /* ইনপুট ফিল্ডে ফোকাস গ্রেডিয়েন্ট শ্যাডো */
        .neon-input:focus {
            outline: none;
            border-color: var(--c-cyan);
            box-shadow: 0 0 15px rgba(0, 230, 255, 0.4), inset 0 0 8px rgba(255, 43, 110, 0.2);
            background: rgba(0, 230, 255, 0.05);
        }

        .btn-wrap { padding-top: 1rem; }

        /* হাই-এনার্জি অ্যানিমেটেড গ্রেডিয়েন্ট বাটন */
        .neon-btn {
            width: 100%; padding: 1rem; border-radius: 0.5rem; display: flex; justify-content: center; align-items: center; gap: 0.5rem;
            background: linear-gradient(90deg, var(--c-pink), var(--c-cyan), var(--c-green), var(--c-pink)); background-size: 300%;
            animation: gradientMove 4s linear infinite; border: none;
            color: #0b0f19; font-weight: 800; font-size: 1.1rem; font-family: inherit; cursor: pointer; position: relative; overflow: hidden; transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 230, 255, 0.5);
        }
        .neon-btn svg { width: 1.25rem; height: 1.25rem; }
        .neon-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 30px rgba(255, 43, 110, 0.6), 0 0 20px rgba(0, 255, 136, 0.6);
            color: #fff;
        }
        .neon-btn:active { transform: scale(0.98); }

        /* Spinner */
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* সাকসেস মেসেজ স্টাইল */
        .success-state { display: none; text-align: center; padding: 2rem 0; }
        .success-state.show { display: block; }
        .success-icon { display: inline-flex; align-items: center; justify-content: center; width: 4.5rem; height: 4.5rem; border-radius: 50%; background: linear-gradient(45deg, var(--c-green), var(--c-cyan)); margin-bottom: 1rem; box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); animation: popIn 0.5s ease; }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
        .success-icon svg { width: 2.5rem; height: 2.5rem; color: #0b0f19; }
        .success-state h3 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; }
        .success-state p { color: #a0a0a0; font-size: 0.95rem; }
        .reset-btn { margin-top: 1.5rem; background: none; border: none; font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.2s ease; }
        .reset-btn.gradient-text { display: inline-block; }
        .reset-btn:hover { filter: brightness(1.2); text-decoration: underline; }
    </style>
</head>
<body>

    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>

    <div class="neon-container">
        <a href="index.html" class="back-home gradient-text"><span class="arrow">&#8592;</span> Home</a>

        <div class="form-header">
            <h2 class="gradient-text">Contact Us</h2>
            <p>We would love to hear from you!</p>
        </div>

        <form action="https://api.web3forms.com/submit" method="post" id="glowForm">
            <input type="hidden" name="access_key" value="3f1cc6be-ed95-4831-b984-0b19db2647e6">

            <div class="field-group">
                <label for="fullName" class="neon-label">Your Name</label>
                <input type="text" id="fullName" name="from_name" class="neon-input" placeholder="e.g. John Doe" required>
            </div>
            <div class="field-group">
                <label for="email" class="neon-label">Email Address</label>
                <input type="email" id="email" name="email" class="neon-input" placeholder="e.g. john@example.com" required>
            </div>
            <div class="field-group">
                <label for="subject" class="neon-label">Subject</label>
                <input type="text" id="subject" name="subject" class="neon-input" placeholder="How can I help?" required>
            </div>
            <div class="field-group">
                <label for="message" class="neon-label">Message</label>
                <textarea id="message" name="message" rows="4" class="neon-input" placeholder="Write your message here..." required></textarea>
            </div>

            <div class="btn-wrap">
                <button type="submit" class="neon-btn">
                    <span>Send Message</span>
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </button>
            </div>
        </form>

        <div id="successState" class="success-state">
            <div class="success-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h3 class="gradient-text">Message Sent!</h3>
            <p>Thank you for contacting us. We will get back to you soon.</p>
            <button onclick="resetForm()" class="reset-btn gradient-text">Send another message</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.getElementById('glowForm');
            if (form) {
                form.addEventListener('submit', function(event) {
                    event.preventDefault();

                    const successState = document.getElementById('successState');
                    const submitBtn = form.querySelector('button[type="submit"]');
                    const originalBtnContent = submitBtn.innerHTML;

                    // লোডিং স্পিনার অ্যানিমেশন
                    submitBtn.innerHTML = `
                        <svg class="spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" style="width:1.25rem;height:1.25rem;">
                            <circle style="opacity:0.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path style="opacity:0.75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Sending...
                    `;
                    submitBtn.style.pointerEvents = 'none';
                    submitBtn.style.opacity = '0.9';

                    fetch(form.action, {
                        method: form.method,
                        body: new FormData(form),
                        headers: { 'Accept': 'application/json' }
                    }).then(response => {
                        if (response.ok) {
                            form.style.display = 'none';
                            successState.classList.add('show');
                            form.reset();
                        } else {
                            alert("Oops! Something went wrong.");
                        }
                    }).catch(error => {
                        alert("Network error! Please check your connection.");
                    }).finally(() => {
                        submitBtn.innerHTML = originalBtnContent;
                        submitBtn.style.pointerEvents = 'auto';
                        submitBtn.style.opacity = '1';
                    });
                });
            }
        });

        function resetForm() {
            document.getElementById('successState').classList.remove('show');
            document.getElementById('glowForm').style.display = 'flex';
        }
    </script>
</body>
</html>
