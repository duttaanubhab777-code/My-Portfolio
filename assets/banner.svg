<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0d22"/><stop offset=".5" stop-color="#1b2144"/><stop offset="1" stop-color="#2a1420"/>
<animate attributeName="x1" values="0;1;0" dur="10s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#ff7a3d"><animate attributeName="stop-color" values="#ff7a3d;#7c8cff;#ffb347;#ff7a3d" dur="6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#ff5a4f"><animate attributeName="stop-color" values="#ff5a4f;#ffb347;#7c8cff;#ff5a4f" dur="6s" repeatCount="indefinite"/></stop></linearGradient>
<filter id="gl"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>@keyframes fl{0%,100%{opacity:.15;transform:translateY(0)}50%{opacity:1;transform:translateY(-14px)}}
.t{font-family:'Segoe UI',Arial,sans-serif}
.n{stroke-dasharray:1400;stroke-dashoffset:1400;animation:dr 4s ease forwards,pu 3s ease-in-out 4s infinite}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes pu{50%{opacity:.6}}
.s{animation:up 1.4s ease .6s both}@keyframes up{from{opacity:0;transform:translateY(20px)}}
.cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}</style>
